main: com.cavetale.raid.RaidPlugin
name: Raid
version: 0.1
api-version: '26.3'
description: Turn worlds into raids
author: StarTux
website: https://cavetale.com

depend:

- Core
- Mytems
- Creative

softdepend: []

commands:

  raid:
    aliases: []
    description: User Interface
    permission: raid.raid
    usage: /raid

  raidadmin:
    aliases: []
    description: Admin Command
    permission: raid.admin
    usage: /raidadmin

  raidedit:
    aliases: [redit]
    description: Raid Editor Command
    permission: raid.edit
    usage: /raidedit

permissions:
  raid.raid:
    description: Use /raid
    default: op

  raid.edit:
    description: Use /raidedit
    default: op

  raid.admin:
    description: Use /raidadmin
    default: op
